site_name: Daniel Avissar | AI Knowledge Architect
site_description: Good documentation is a product in its own right — an interactive portfolio of knowledge architecture, technical writing, and UX writing case studies
site_url: https://iiimonfiiire.github.io/daniel-avissar-portfolio/
repo_name: daniel-avissar-portfolio

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.png
  palette:
    # slate (dark) is kept as the base scheme -- Carcharias is dark-by-default
    # (the Abyss ramp), so we build the brand retrofit on top of slate rather
    # than switching to Material's light "default" scheme. The primary/accent
    # names below are Material enum placeholders only: every actual color
    # they'd normally drive is overridden in
    # stylesheets/carcharias-material-overrides.css.
    - scheme: slate
      primary: red
      accent: red
  features:
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
  icon:
    admonition:
      idea: octicons/light-bulb-16  # or fontawesome/solid/lightbulb

extra_css:
  - stylesheets/carcharias.css
  - stylesheets/carcharias-material-overrides.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.blocks.caption
  - pymdownx.details

plugins:
   - glightbox:
       touchNavigation: true
       loop: false
       effect: zoom
       slide_effect: slide
       width: 100%
       height: auto
       zoomable: true
       draggable: true
       skip_classes:
         - cs-hero__photo
       auto_themed: false
       auto_caption: false
       caption_position: bottom
       background: white
       shadow: true
       manual: false

nav:
  - Home: 
      - index.md
      - Knowledge Architecture: what-i-do/knowledge-architecture.md
      - Feature Development: what-i-do/feature-development.md
      - UX Writing: what-i-do/ux-writing.md
      - Technical Versatility: what-i-do/technical-versatility.md
  - Case Studies:
      - Secyra (2025):
          - case-studies/secyra-2025/index.md
          - Release note: case-studies/secyra-2025/release-note.md
          - Knowledge base article: case-studies/secyra-2025/knowledge-base.md
          - Microcopy: case-studies/secyra-2025/microcopy.md
          - Troubleshooting guide: case-studies/secyra-2025/troubleshooting-guide.md
      - Acme (2024):
          - case-studies/acme-2024/index.md
          - Release note: case-studies/acme-2024/release-notes.md
          - Knowledge base article: case-studies/acme-2024/discover.md
      - Website API (2021):
          - case-studies/webapi-2021/index.md
  - Extras:
      - Perf & Vero Board: extras/perf-vero-board.md
